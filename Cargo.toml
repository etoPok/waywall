[package]
name = "waywall"
version = "0.1.0"
edition = "2021"
description = "Minimal animated wallpaper using FFmpeg + OpenGL + Wayland layer-shell"
rust-version = "1.90"

[lib]
name = "waywall"
path = "src/lib.rs"

[[bin]]
name = "waywall"
path = "src/main.rs"

[dependencies]
# Wayland client stack
wayland-client = "0.31.15"
wayland-protocols = { version = "0.32.13", features = ["client", "unstable"] }
wayland-protocols-wlr = { version = "0.3.12", features = ["client"] }
wayland-backend = { version = "0.3.17", features = ["client_system"] }

# smithay-client-toolkit: Wayland abstractions (output info, seat, etc.)
smithay-client-toolkit = { version = "0.21.1", default-features = false, features = [
    "calloop",
    "xkbcommon",
] }

# Event loop
calloop = "0.14.4"
calloop-wayland-source = "0.4.1"

# FFmpeg
ffmpeg-sys-next = "9.0.0"

# OpenGL bindings
gl = "0.14.0"

# Error handling
anyhow = "1.0.104"

# Logging
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

# POSIX signals for clean shutdown
libc = "0.2.189"

nix = { version = "0.31.3", features = ["poll"] }
